<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peleng — камера</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
           background: rgba(0,0,0,.72); display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; }
  input { width: 110px; }
  button.primary { background: #0a7; border-color: #0a7; color: #fff; font-weight: 600; }
  button.stop { background: #c33; border-color: #c33; }
  #status { font-family: ui-monospace, monospace; font-size: 13px; color: #9f9; }
  #err { color: #f88; font-size: 13px; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline muted autoplay></video>
  <div id="panel">
    <div class="row">
      <label>ID <input id="camId" placeholder="phone1"></label>
      <select id="res">
        <option value="1280x720" selected>1280×720</option>
        <option value="1920x1080">1920×1080</option>
        <option value="960x540">960×540</option>
        <option value="640x480">640×480</option>
      </select>
      <select id="fps" title="Частота съёмки камеры. Отправляется столько кадров, сколько просит сервер">
        <option selected>30</option><option>60</option>
      </select>
      <label>к/с камеры</label>
    </div>
    <div class="row">
      <button id="start" class="primary">Старт</button>
      <button id="stop" class="stop hide">Стоп</button>
      <button id="lock" class="hide" title="Зафиксировать фокус и экспозицию (Android Chrome)">Фикс. фокус</button>
      <select id="camSel" class="hide"></select>
    </div>
    <div id="status">не подключено</div>
    <div id="err"></div>
  </div>
</div>
<script>
// Телефон шлёт JPEG-кадры на сервер: [8 байт float64 LE — время кадра в часах сервера][JPEG]
// Кадр снимается по команде сервера {"type":"capture","w":N}: N — ширина кадра (уменьшаем здесь, чтобы не гнать
// лишнее по Wi-Fi), 0 — полное разрешение камеры (калибровка). Разрешение в списке — полное разрешение камеры.
const $ = (id) => document.getElementById(id);
const v = $("v");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d");
let stream = null, ws = null, running = false, wakeLock = null;
let offset = 0, bestRtt = Infinity;   // серверное_время = Date.now()/1000 + offset
let sent = 0, sentT = performance.now(), fpsShown = 0, busy = false;

$("camId").value = localStorage.getItem("peleng.camId") || ("phone" + Math.floor(Math.random() * 90 + 10));
for (const k of ["res", "fps"]) {
  const s = localStorage.getItem("peleng." + k);
  if (s && [...$(k).options].some(o => o.value === s)) $(k).value = s;
}

function err(msg) { $("err").textContent = msg || ""; }

async function listCameras() {
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const sel = $("camSel");
    sel.innerHTML = "";
    devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || ("камера " + (i + 1)); sel.appendChild(o); });
    sel.classList.toggle("hide", devs.length < 2);
  } catch (e) { /* ignore */ }
}

async function openCamera(deviceId) {
  const [w, h] = $("res").value.split("x").map(Number);
  const video = { width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: Number($("fps").value) } };
  if (deviceId) video.deviceId = { exact: deviceId }; else video.facingMode = { ideal: "environment" };
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  v.srcObject = stream;
  await v.play();
  const track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $("lock").classList.toggle("hide", !(caps.focusMode || caps.exposureMode));
  await listCameras();
  return track;
}

function connect() {
  const id = $("camId").value.trim() || "phone";
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/push/${encodeURIComponent(id)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    const s = stream.getVideoTracks()[0].getSettings();
    ws.send(JSON.stringify({ type: "hello", name: id, ua: navigator.userAgent, width: s.width, height: s.height, frameRate: s.frameRate,
                             vw: v.videoWidth, vh: v.videoHeight, on_demand: true }));
    ping();
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "capture") {
      sendFrame(m.w || 0);
    } else if (m.type === "pong") {
      const now = Date.now();
      const rtt = now - m.tc;
      // берём замер с минимальной задержкой — он точнее (как в NTP)
      if (rtt <= bestRtt * 1.2) { bestRtt = Math.min(bestRtt, rtt); offset = m.ts - (m.tc + rtt / 2) / 1000; }
      lastRtt = rtt;
    }
  };
  ws.onclose = () => { if (running) setTimeout(connect, 1000); };
  ws.onerror = () => err("ошибка соединения с сервером");
}
let lastRtt = 0;
function ping() { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping", tc: Date.now() })); }
setInterval(ping, 2000);
setInterval(() => { bestRtt *= 1.05; }, 5000); // постепенно «забываем» старый лучший замер

let pendingW = null;  // команда пришла, пока предыдущий кадр ещё сжимался — снимем сразу после
function sendFrame(w) {
  if (!running) return;
  const ws_ = ws;
  if (!ws_ || ws_.readyState !== 1 || ws_.bufferedAmount > 1.5e6 || !v.videoWidth) return;
  if (busy) { pendingW = w; return; }
  busy = true;
  const tCapture = Date.now() / 1000 + offset;
  const vw = v.videoWidth, vh = v.videoHeight;
  const tw = w && w < vw ? w : vw;
  const th = Math.round(vh * tw / vw / 2) * 2;
  if (canvas.width !== tw || canvas.height !== th) { canvas.width = tw; canvas.height = th; }
  ctx.drawImage(v, 0, 0, tw, th);
  canvas.toBlob(async (blob) => {
    try {
      if (blob && ws_.readyState === 1) {
        const buf = new Uint8Array(8 + blob.size);
        new DataView(buf.buffer).setFloat64(0, tCapture, true);
        buf.set(new Uint8Array(await blob.arrayBuffer()), 8);
        ws_.send(buf);
        sent++; lastSize = `${tw}×${th}`;
      }
    } finally {
      busy = false;
      if (pendingW !== null) { const pw = pendingW; pendingW = null; sendFrame(pw); }
    }
  }, "image/jpeg", 0.75);
}
let lastSize = "";

setInterval(() => {
  const now = performance.now();
  fpsShown = sent * 1000 / (now - sentT); sent = 0; sentT = now;
  if (running) $("status").textContent =
    `камера ${v.videoWidth}×${v.videoHeight} | отправка ${fpsShown.toFixed(1)} к/с ${lastSize} | RTT ${lastRtt} мс | ` +
    (ws && ws.readyState === 1 ? "подключено" : "переподключение…");
}, 1000);

$("start").onclick = async () => {
  err("");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    err("Браузер не даёт доступ к камере. Откройте страницу по HTTPS (https://IP:порт/cam) и примите сертификат.");
    return;
  }
  localStorage.setItem("peleng.camId", $("camId").value.trim());
  localStorage.setItem("peleng.res", $("res").value);
  localStorage.setItem("peleng.fps", $("fps").value);
  try {
    await openCamera($("camSel").value || null);
  } catch (e) { err("Камера: " + e.message); return; }
  running = true;
  connect();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) { /* не везде есть */ }
  $("start").classList.add("hide"); $("stop").classList.remove("hide");
};

$("stop").onclick = () => {
  running = false;
  pendingW = null;
  if (ws) ws.close();
  if (stream) stream.getTracks().forEach(t => t.stop());
  wakeLock?.release?.();
  $("start").classList.remove("hide"); $("stop").classList.add("hide");
  $("status").textContent = "остановлено";
};

$("camSel").onchange = async () => { if (running) await openCamera($("camSel").value); };

$("lock").onclick = async () => {
  const track = stream?.getVideoTracks()[0];
  if (!track) return;
  const caps = track.getCapabilities();
  const adv = {};
  if (caps.focusMode?.includes("manual")) adv.focusMode = "manual";
  if (caps.exposureMode?.includes("manual")) adv.exposureMode = "manual";
  if (caps.whiteBalanceMode?.includes("manual")) adv.whiteBalanceMode = "manual";
  try { await track.applyConstraints({ advanced: [adv] }); $("lock").textContent = "Фокус зафиксирован"; }
  catch (e) { err("Не удалось зафиксировать: " + e.message); }
};

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && running) {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  }
});
</script>
</body>
</html>
